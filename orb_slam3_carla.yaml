%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters (CARLA RGB-D: 1280x720, FOV 90°)
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera intrinsics: fx = fy = width / (2 * tan(FOV/2)) = 1280 / (2 * tan(45°)) = 640
Camera.fx: 640.0
Camera.fy: 640.0
Camera.cx: 640.0
Camera.cy: 360.0

# No distortion (CARLA virtual camera)
Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0
Camera.k3: 0.0

Camera.width: 1280
Camera.height: 720

# Camera frames per second
Camera.fps: 20

# Color order of the images (0: BGR, 1: RGB)
Camera.RGB: 1

# Depth map factor (depth in meters * factor = depth value)
# CARLA publishes depth in meters, ORB-SLAM3 expects depth such that depth/factor = meters
# So factor = 1.0
Camera.bf: 640.0
ThDepth: 40.0
DepthMapFactor: 1.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
